<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="warmSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="40%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#E8F8F0"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07866B"/>
      <stop offset="100%" stop-color="#18A999"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4B942"/>
      <stop offset="100%" stop-color="#E5A729"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#F4B942" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FDECCB" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FAF7F0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Sky / Sanctuary Canvas -->
  <rect width="800" height="500" rx="24" fill="url(#warmSky)"/>
  <circle cx="160" cy="100" r="180" fill="url(#sunGlow)"/>

  <!-- Arched Windows -->
  <path d="M60 480 V160 Q60 60 160 60 Q260 60 260 160 V480 Z" fill="#FFFFFF" fill-opacity="0.6" stroke="#07866B" stroke-opacity="0.2" stroke-width="2"/>
  <path d="M280 480 V140 Q280 40 380 40 Q480 40 480 140 V480 Z" fill="#FFFFFF" fill-opacity="0.7" stroke="#07866B" stroke-opacity="0.25" stroke-width="2"/>
  
  <!-- Bookshelf Arch on the Right -->
  <path d="M520 480 V160 Q520 50 660 50 Q780 50 780 160 V480 Z" fill="#F5EFEB" stroke="#07866B" stroke-opacity="0.2" stroke-width="3"/>
  <line x1="530" y1="180" x2="770" y2="180" stroke="#07866B" stroke-opacity="0.2" stroke-width="4"/>
  <line x1="530" y1="260" x2="770" y2="260" stroke="#07866B" stroke-opacity="0.2" stroke-width="4"/>
  <line x1="530" y1="340" x2="770" y2="340" stroke="#07866B" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Colorful Books on Shelves -->
  <rect x="545" y="195" width="14" height="65" rx="3" fill="#07866B"/>
  <rect x="562" y="205" width="18" height="55" rx="3" fill="#F4B942"/>
  <rect x="583" y="190" width="16" height="70" rx="3" fill="#18A999"/>
  <rect x="602" y="200" width="12" height="60" rx="3" fill="#F28B82"/>
  <rect x="617" y="185" width="20" height="75" rx="3" fill="#0E2922"/>
  <rect x="640" y="210" width="15" height="50" rx="3" fill="#07866B"/>
  <rect x="658" y="195" width="18" height="65" rx="3" fill="#B8F2D0"/>
  <rect x="679" y="200" width="14" height="60" rx="3" fill="#F4B942"/>

  <!-- Curved Study Desk -->
  <path d="M120 480 C180 380 440 370 760 410 L760 480 Z" fill="#EADCCB" stroke="#07866B" stroke-opacity="0.2" stroke-width="2"/>
  <ellipse cx="380" cy="390" rx="180" ry="16" fill="#F5EFEB" stroke="#07866B" stroke-opacity="0.15"/>

  <!-- Laptop on Desk -->
  <rect x="330" y="340" width="90" height="55" rx="4" fill="#0E2922"/>
  <rect x="335" y="345" width="80" height="45" rx="2" fill="#FFFFFF"/>
  <path d="M342 355 H370 M342 362 H395 M342 369 H380 M342 376 H365" stroke="#07866B" stroke-width="2" stroke-linecap="round"/>
  <polygon points="310,396 440,396 425,402 325,402" fill="#CAD2CE"/>

  <!-- Open Glowing Book (Holographic knowledge) -->
  <path d="M220 375 C240 370 260 375 275 385 C290 375 310 370 330 375 L325 405 C305 400 288 404 275 412 C262 404 245 400 225 405 Z" fill="#FFFFFF" stroke="#07866B" stroke-width="2"/>
  <circle cx="275" cy="360" r="28" fill="#F4B942" fill-opacity="0.25"/>
  <path d="M275 342 L279 354 L291 354 L281 362 L285 374 L275 366 L265 374 L269 362 L259 354 L271 354 Z" fill="#F4B942"/>

  <!-- Plants & Ivy -->
  <circle cx="100" cy="380" r="45" fill="#B8F2D0" fill-opacity="0.8"/>
  <circle cx="80" cy="360" r="30" fill="#07866B" fill-opacity="0.7"/>
  <circle cx="115" cy="355" r="35" fill="#18A999" fill-opacity="0.8"/>
  <circle cx="710" cy="110" r="35" fill="#B8F2D0" fill-opacity="0.8"/>
  <circle cx="735" cy="130" r="30" fill="#07866B" fill-opacity="0.8"/>

  <!-- Floating Knowledge Particles -->
  <circle cx="240" cy="220" r="4" fill="#F4B942"/>
  <circle cx="390" cy="180" r="5" fill="#18A999"/>
  <circle cx="480" cy="240" r="3" fill="#F4B942"/>
  <circle cx="310" cy="140" r="4" fill="#07866B"/>
  <circle cx="440" cy="110" r="6" fill="#F4B942" fill-opacity="0.8"/>
</svg>
